<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProofPoint</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background:#000; color:#0f0; }
    #proofText { width: 80%; height: 60px; margin-bottom:10px; }
    #testBtn, #clearBtn { margin: 5px; padding: 10px 20px; }
    #proofHistory { margin-top: 20px; border-top: 1px solid #0f0; padding-top: 10px; }
    #spinner { display: none; margin-top: 10px; color: yellow; font-weight: bold; }
  </style>
</head>
<body>
  <h1>ProofPoint</h1>

  <textarea id="proofText" placeholder="Enter proof text"></textarea><br>
  <button id="testBtn">Submit Proof</button>
  <button id="clearBtn">Clear History</button>

  <div id="spinner">Loading...</div>

  <div id="proofHistory"></div>

  <script src="app.js"></script>
</body>
</html>
